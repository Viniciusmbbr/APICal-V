<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>API Calculadora</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #1e1e2e;
      --accent: #00f5a0;
      --accent2: #00d9f5;
      --text: #e8e8f0;
      --muted: #6b6b8a;
      --error: #ff4d6d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(0,245,160,0.05) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(0,217,245,0.05) 0%, transparent 60%);
    }

    header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown 0.6s ease both;
    }

    header h1 {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    header p {
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      margin-top: 8px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 520px;
      animation: fadeUp 0.6s ease both;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 24px;
      font-family: 'Space Mono', monospace;
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.75rem;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 1.1rem;
      width: 100%;
      transition: border-color 0.2s;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
    }

    .ops {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .op-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .op-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .op-btn .symbol {
      font-size: 1.4rem;
      font-family: 'Space Mono', monospace;
      width: 32px;
      height: 32px;
      background: var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      font-family: 'Space Mono', monospace;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.3s;
    }

    .result-box.success { border-color: var(--accent); }
    .result-box.error { border-color: var(--error); }

    .result-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .result-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
    }

    .result-value.error-text { color: var(--error); font-size: 0.9rem; }

    /* Histórico */
    .history-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 520px;
      margin-top: 20px;
      animation: fadeUp 0.7s ease both;
    }

    .history-card h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      font-family: 'Space Mono', monospace;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 240px;
      overflow-y: auto;
    }

    .history-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      animation: fadeUp 0.3s ease both;
    }

    .history-item .op-tag {
      background: var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      color: var(--accent2);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .history-item .res {
      color: var(--accent);
      font-weight: 700;
    }

    /* Gráfico */
    .chart-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 12px;
      padding: 16px;
      color: var(--bg);
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 16px;
      transition: opacity 0.2s, transform 0.2s;
    }

    .chart-btn:hover { opacity: 0.85; transform: translateY(-2px); }

    .chart-area {
      margin-top: 20px;
      width: 100%;
      max-width: 520px;
      display: none;
      animation: fadeUp 0.4s ease both;
    }

    .chart-area img {
      width: 100%;
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    .empty {
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      text-align: center;
      padding: 20px 0;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>🧮 Calculadora</h1>
    <p>API powered by FastAPI + Python</p>
  </header>

  <div class="card">
    <h2>// Operação</h2>
    <div class="inputs">
      <div class="input-group">
        <label>Número 1</label>
        <input type="number" id="n1" placeholder="0" />
      </div>
      <div class="input-group">
        <label>Número 2</label>
        <input type="number" id="n2" placeholder="0" />
      </div>
    </div>

    <div class="ops">
      <button class="op-btn" onclick="calcular('soma')">
        <span class="symbol">+</span> Soma
      </button>
      <button class="op-btn" onclick="calcular('subtracao')">
        <span class="symbol">−</span> Subtração
      </button>
      <button class="op-btn" onclick="calcular('multiplicacao')">
        <span class="symbol">×</span> Multiplicação
      </button>
      <button class="op-btn" onclick="calcular('divisao')">
        <span class="symbol">÷</span> Divisão
      </button>
    </div>

    <div class="result-box" id="resultBox">
      <span class="result-label">Resultado</span>
      <span class="result-value" id="resultValue">—</span>
    </div>
  </div>

  <div class="history-card">
    <h2>// Histórico</h2>
    <div class="history-list" id="historyList">
      <p class="empty">Nenhum cálculo ainda...</p>
    </div>
    <button class="chart-btn" onclick="verGrafico()">📊 Ver Gráfico do Histórico</button>
  </div>

  <div class="chart-area" id="chartArea">
    <img id="chartImg" src="" alt="Gráfico" />
  </div>

  <script>
    const historico = [];

    async function calcular(operacao) {
      const n1 = parseFloat(document.getElementById('n1').value);
      const n2 = parseFloat(document.getElementById('n2').value);

      if (isNaN(n1) || isNaN(n2)) {
        mostrarErro('Preencha os dois números!');
        return;
      }

      try {
        const res = await fetch(`http://localhost:8000/${operacao}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ numero1: n1, numero2: n2 })
        });

        const data = await res.json();

        if (!res.ok) {
          mostrarErro(data.detail);
          return;
        }

        mostrarResultado(data.resultado);
        adicionarHistorico(data.operacao, n1, n2, data.resultado);

      } catch (e) {
        mostrarErro('Erro ao conectar com a API. O servidor está rodando?');
      }
    }

    function mostrarResultado(valor) {
      const box = document.getElementById('resultBox');
      const val = document.getElementById('resultValue');
      box.className = 'result-box success';
      val.className = 'result-value';
      val.textContent = valor;
    }

    function mostrarErro(msg) {
      const box = document.getElementById('resultBox');
      const val = document.getElementById('resultValue');
      box.className = 'result-box error';
      val.className = 'result-value error-text';
      val.textContent = msg;
    }

    function adicionarHistorico(op, n1, n2, resultado) {
      historico.push({ op, n1, n2, resultado });
      const list = document.getElementById('historyList');
      
      if (historico.length === 1) list.innerHTML = '';

      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `
        <span class="op-tag">${op}</span>
        <span>${n1} · ${n2}</span>
        <span class="res">= ${resultado}</span>
      `;
      list.prepend(item);
    }

    async function verGrafico() {
      try {
        const res = await fetch('http://localhost:8000/grafico');
        if (!res.ok) {
          alert('Faça pelo menos um cálculo antes de ver o gráfico!');
          return;
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const chartArea = document.getElementById('chartArea');
        document.getElementById('chartImg').src = url;
        chartArea.style.display = 'block';
        chartArea.scrollIntoView({ behavior: 'smooth' });
      } catch(e) {
        alert('Erro ao buscar o gráfico.');
      }
    }
  </script>
</body>
</html>
